<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - JUNIOR STUDY HUB</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="auth.js"></script>
<style>
.auth-box {max-width:400px; margin:80px auto; background:var(--card); padding:30px; border-radius:12px; border:1px solid var(--border)}
.auth-box input {width:100%; padding:12px; margin:8px 0 16px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); box-sizing:border-box}
.auth-box button {width:100%}
.error {color:#ef4444; font-size:0.9rem; margin-bottom:10px}
.success {color:#22c55e; font-size:0.9rem; margin-bottom:10px}
</style>
</head>
<body>
<div class="auth-box">
  <h2 style="text-align:center; color:var(--accent); margin-bottom:20px">Register</h2>
  <div id="auth-msg"></div>
  <form onsubmit="registerUser(event)">
    <label>Email</label>
    <input type="email" id="reg-user" required>
    <label>Password</label>
    <input type="password" id="reg-pass" minlength="6" required>
    <button type="submit">Create Account</button>
  </form>
  <p style="text-align:center; margin-top:20px; font-size:0.9rem">
    Already have an account? <a href="login.html" style="color:var(--accent)">Login</a>
  </p>
</div>
</body>
</html>
