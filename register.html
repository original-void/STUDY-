<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
    input { display: block; width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #38a169; color: white; border: none; cursor: pointer; }
    a { display: block; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Create Account</h2>
  <form id="registerForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (min 6 chars)" required>
    <button type="submit">Register</button>
  </form>
  <a href="login.html">Already have account? Login</a>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const cred = await auth.createUserWithEmailAndPassword(email.value, password.value);
        await cred.user.updateProfile({ displayName: name.value });
        location.href = 'index.html';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
  </script>
</body>
</html>
