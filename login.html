<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Junior Study Hub</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a202c;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .login-box {
    background: #2d3748;
    padding: 40px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 30px 0;
    text-align: center;
    color: #90cdf4;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #1a202c;
    border: 1px solid #4a5568;
    border-radius: 4px;
    color: #e2e8f0;
    font-size: 16px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #63b3ed;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #2c5282;
  }
  button:disabled {
    background: #4a5568;
    cursor: not-allowed;
  }
  #error-msg {
    color: #fc8181;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    text-align: center;
  }
  #success-msg {
    color: #68d391;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    text-align: center;
  }
  .links {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
  }
  .links a {
    color: #63b3ed;
    text-decoration: none;
    cursor: pointer;
    display: block;
    margin: 8px 0;
  }
  .links a:hover {
    text-decoration: underline;
  }
  .whatsapp-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  margin-top: 20px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
  text-decoration: none;
  box-sizing: border-box;
}
.whatsapp-btn:hover {
  background: #1ebe57;
}
.whatsapp-icon {
  width: 20px;
  height: 20px;
}
.divider {
  margin: 20px 0 0 0;
  text-align: center;
  color: #718096;
  font-size: 14px;
  position: relative;
}
.divider::before,
.divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: #4a5568;
}
.divider::before { left: 0; }
.divider::after { right: 0; }
</style>
</head>
<body>
<div class="login-box">
  <h1>Login to Junior Study Hub</h1>
  
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <div id="error-msg"></div>
  <div id="success-msg"></div>
  <button id="login-btn">Login</button>
  
  <div class="links">
    <a id="forgot-btn">Forgot password?</a>
    <a id="signup-toggle">Don't have an account? Sign up</a>
  </div>
</div>
  <div class="divider">or</div>

<a href="https://whatsapp.com/channel/0029Vb7mLF1LNSZy2QdGe72L" target="_blank" class="whatsapp-btn">
  <svg class="whatsapp-icon" viewBox="0 0 32 32" fill="currentColor">
    <path d="M16.003 2.667C8.64 2.667 8.64 2.667 16.003c0 2.827.747 5.547 2.173 7.947L2.667 29.333l5.547-2.133c2.293 1.28 4.907 1.947 7.787 1.947 7.36 0 13.333-5.973 13.333-13.333S23.363 2.667 16.003 2.667zm7.893 18.827c-.32.893-1.867 1.707-2.613 1.813-.747.107-1.68.16-5.44-1.147-4.587-1.6-7.547-5.6-7.773-5.867-.227-.267-1.813-2.4-1.813-4.587s1.147-3.253 1.547-3.68c.4-.427 1.067-.613 1.707-.613.213 0 .427.053.613.053.213 0 .48-.08.747.573.267.653.907 2.24.987 2.4.08.16.133.347.027.573-.107.227-.16.373-.32.573-.16.2-.347.44-.493.587-.16.16-.32.333-.133.647.187.32.827 1.36 1.773 2.2 1.227 1.093 2.253 1.44 2.587 1.6.333.16.533.133.733-.08.2-.213.853-1.013 1.08-1.36.227-.347.453-.293.773-.173.32.12 2.027.96 2.373 1.133.347.173.573.267.653.413.08.147.08.853-.24 1.747z"/>
  </svg>
  Join WhatsApp Channel
</a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjPfuz8DdGgEnRsD9nXeka2yN7v_oh3jk",
    authDomain: "junior-study.firebaseapp.com",
    projectId: "junior-study",
    storageBucket: "junior-study.firebasestorage.app",
    messagingSenderId: "942218434406",
    appId: "1:942218434406:web:8e95fc80fc28c79fe01aa7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const errorDiv = document.getElementById('error-msg');
  const successDiv = document.getElementById('success-msg');
  const loginBtn = document.getElementById('login-btn');
  const signupToggle = document.getElementById('signup-toggle');
  const forgotBtn = document.getElementById('forgot-btn');
  
  let isSignupMode = false;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = 'index.html';
    }
  });

  function clearMessages() {
    errorDiv.textContent = '';
    successDiv.textContent = '';
  }

  // Toggle between Login / Signup
  signupToggle.addEventListener('click', () => {
    isSignupMode = !isSignupMode;
    clearMessages();
    
    if (isSignupMode) {
      loginBtn.textContent = 'Sign Up';
      signupToggle.textContent = 'Already have an account? Login';
      document.querySelector('h1').textContent = 'Create Account';
    } else {
      loginBtn.textContent = 'Login';
      signupToggle.textContent = "Don't have an account? Sign up";
      document.querySelector('h1').textContent = 'Login to Junior Study Hub';
    }
  });

  // Login or Signup
  loginBtn.addEventListener('click', () => {
    const emailVal = email.value.trim();
    const passVal = password.value;
    clearMessages();
    
    if (!emailVal || !passVal) {
      errorDiv.textContent = 'Please enter email and password';
      return;
    }

    if (passVal.length < 6 && isSignupMode) {
      errorDiv.textContent = 'Password must be at least 6 characters';
      return;
    }
    
    loginBtn.disabled = true;
    loginBtn.textContent = isSignupMode ? 'Creating...' : 'Logging in...';

    const authAction = isSignupMode 
      ? createUserWithEmailAndPassword(auth, emailVal, passVal)
      : signInWithEmailAndPassword(auth, emailVal, passVal);

    authAction
      .then(() => {
        window.location.href = 'index.html';
      })
      .catch((error) => {
        let message = 'Failed. Try again';
        
        if (isSignupMode) {
          if (error.code === 'auth/email-already-in-use') {
            message = 'Email already registered. Try logging in';
          } else if (error.code === 'auth/invalid-email') {
            message = 'Invalid email format';
          } else if (error.code === 'auth/weak-password') {
            message = 'Password too weak';
          }
        } else {
          if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password'].includes(error.code)) {
            message = 'Incorrect password or email';
          } else if (error.code === 'auth/too-many-requests') {
            message = 'Too many attempts. Try again later';
          }
        }
        
        errorDiv.textContent = message;
        loginBtn.disabled = false;
        loginBtn.textContent = isSignupMode ? 'Sign Up' : 'Login';
      });
  });

  // Forgot Password
  forgotBtn.addEventListener('click', () => {
    const emailVal = email.value.trim();
    clearMessages();
    
    if (!emailVal) {
      errorDiv.textContent = 'Enter your email first';
      return;
    }

    sendPasswordResetEmail(auth, emailVal)
      .then(() => {
        successDiv.textContent = 'Reset email sent. Check your inbox';
      })
      .catch((error) => {
        if (error.code === 'auth/user-not-found') {
          errorDiv.textContent = 'No account found with that email';
        } else if (error.code === 'auth/invalid-email') {
          errorDiv.textContent = 'Invalid email format';
        } else {
          errorDiv.textContent = 'Error sending reset email';
        }
      });
  });

  // Enter key submits
  password.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loginBtn.click();
  });
</script>
</body>
</html>
