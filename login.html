<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
    input { display: block; width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; cursor: pointer; }
    a { display: block; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Login to Junior Study Hub </h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <a href="register.html">Create new account</a>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await auth.signInWithEmailAndPassword(email.value, password.value);
        location.href = 'index.html';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
    auth.onAuthStateChanged(user => {
      if (user) location.href = 'index.html';
    });
  </script>
</body>
</html>
