<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Junior Study Hub</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a202c;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .login-box {
    background: #2d3748;
    padding: 40px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  h1 {
    margin: 0 0 30px 0;
    text-align: center;
    color: #90cdf4;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #1a202c;
    border: 1px solid #4a5568;
    border-radius: 4px;
    color: #e2e8f0;
    font-size: 16px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #63b3ed;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 16px;
    background: #2b6cb0;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #2c5282;
  }
  button:disabled {
    background: #4a5568;
    cursor: not-allowed;
  }
  #error-msg {
    color: #fc8181;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>Login to Junior Study Hub</h1>
  
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <div id="error-msg"></div>
  <button id="login-btn">Login</button>
</div>

<script type="module">
  // Import Firebase modular SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Your config
  const firebaseConfig = {
    apiKey: "AIzaSyBjPfuz8DdGgEnRsD9nXeka2yN7v_oh3jk",
    authDomain: "junior-study.firebaseapp.com",
    projectId: "junior-study",
    storageBucket: "junior-study.firebasestorage.app",
    messagingSenderId: "942218434406",
    appId: "1:942218434406:web:8e95fc80fc28c79fe01aa7"
  };

  // Init
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = 'index.html';
    }
  });

  // Login handler
  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });

  function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    
    errorDiv.textContent = '';
    
    if (!email || !password) {
      errorDiv.textContent = 'Please enter email and password';
      return;
    }
    
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = 'index.html';
      })
      .catch((error) => {
        let message = 'Login failed. Try again';
        
        if (['auth/invalid-credential', 'auth/user-not-found', 'auth/wrong-password', 'auth/invalid-email'].includes(error.code)) {
          message = 'Incorrect password or email';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many attempts. Try again later';
        } else if (error.code === 'auth/network-request-failed') {
          message = 'Network error. Check your connection';
        }
        
        errorDiv.textContent = message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      });
  }
</script>
</body>
  </html>
